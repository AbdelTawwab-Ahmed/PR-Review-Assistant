name: CD - Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'latest'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-prod:
    name: Deploy to Azure Container Apps (Production)
    runs-on: ubuntu-latest
    # Requires explicit approval through GitHub Environment Protection Rules
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login
        uses: azure/login@v2
        if: ${{ secrets.AZURE_CREDENTIALS != '' }}
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        if: ${{ secrets.AZURE_CREDENTIALS != '' }}
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Production Backend Image
        uses: docker/build-push-action@v6
        if: ${{ secrets.AZURE_CREDENTIALS != '' }}
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/prra-backend:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/prra-backend:${{ inputs.version }}
            ${{ secrets.ACR_LOGIN_SERVER }}/prra-backend:latest

      - name: Deploy Backend to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        if: ${{ secrets.AZURE_CREDENTIALS != '' }}
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: ${{ secrets.AZURE_CONTAINER_APP_NAME_PROD || 'prra-backend-prod' }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP_PROD || 'prra-prod-rg' }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/prra-backend:${{ github.sha }}
