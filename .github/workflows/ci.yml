name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend CI (Tests & Security)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - run: ruff --version
      - run: ruff check .
      - run: ruff format --check .

      - run: bandit -r app -q

      - run: pytest

  frontend:
    name: Frontend CI (Lint & Typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build
