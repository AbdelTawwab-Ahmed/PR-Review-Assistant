name: CD - Development

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Deploy to Azure Container Apps (Dev)
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login
        uses: azure/login@v2
        if: ${{ secrets.AZURE_CREDENTIALS != '' }}
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        if: ${{ secrets.AZURE_CREDENTIALS != '' }}
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        if: ${{ secrets.AZURE_CREDENTIALS != '' }}
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/prra-backend:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/prra-backend:dev-latest

      - name: Deploy Backend to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        if: ${{ secrets.AZURE_CREDENTIALS != '' }}
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: ${{ secrets.AZURE_CONTAINER_APP_NAME_DEV || 'prra-backend-dev' }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP_DEV || 'prra-dev-rg' }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/prra-backend:${{ github.sha }}
